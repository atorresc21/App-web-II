{% extends "core/base.html" %}


{% block titulo %}{{ titulo }}{% endblock %}


{% block contenido %}
<div class="contenedor">
    <h2>{{ titulo }}</h2>


    <form method="POST">
        {% csrf_token %}


        {% for campo in formulario %}
            <div class="form-group">
                <label for="{{ campo.id_for_label }}">
                    {{ campo.label }}
                </label>


                {{ campo }}


                {% if campo.errors %}
                    <div class="error">
                        {{ campo.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}


        <button type="submit" class="boton">
            Guardar
        </button>


        <a href="{% url volver_url %}" class="boton boton-claro">
            Cancelar
        </a>
    </form>
</div>
{% endblock %}
