{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
<section class="acceso">
    <p class="sobretitulo">Empieza hoy</p>
    <h1>Crear cuenta</h1>
    <p>Solo necesitas unos datos para empezar a ordenar tu dinero.</p>
    <form class="formulario tarjeta dorada" method="post" novalidate>
        {% csrf_token %}
        {% include "core/_campos.html" %}
        <div class="acciones">
            <button class="boton" type="submit">Crear cuenta</button>
        </div>
    </form>
    <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>.</p>
</section>
{% endblock %}
