{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="acceso">
    <p class="sobretitulo">Bienvenido de nuevo</p>
    <h1>Iniciar sesión</h1>
    <p>Entra para ver cómo va tu dinero.</p>
    <form class="formulario tarjeta dorada" method="post" novalidate>
        {% csrf_token %}
        {% include "core/_campos.html" %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="acciones">
            <button class="boton" type="submit">Entrar</button>
        </div>
    </form>
    <p>¿Aún no tienes cuenta? <a href="{% url 'registro' %}">Crea una aquí</a>.</p>
</section>
{% endblock %}
